<title>Filmduo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app — header, card stage, bottom tab bar. Dark cinema theme, single look on purpose. */
:root{
  --bg:#110b16; --surface:#1b1323; --surface-2:#251a30; --line:#382a46;
  --fg:#f7eff9; --muted:#ab9bb6; --accent:#e5398f; --accent-2:#8d48d8;
  --like:#25c97d; --nope:#ff3d5e; --gold:#f5c451;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;gap:10px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand svg{flex:none}
.top .grow{flex:1;min-width:0}
.partner-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;font-size:12.5px;color:var(--muted);max-width:150px;min-width:0}
.partner-chip img{width:24px;height:24px;border-radius:50%;flex:none}
.partner-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;flex:none}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:6px calc(var(--nav-h) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- swipe stage ---------- */
.stage{flex:1;min-height:0;position:relative;margin:4px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:0 18px 40px -18px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);touch-action:none;user-select:none;-webkit-user-select:none;transform-origin:50% 90%;will-change:transform;transition:transform .25s ease, opacity .25s}
.card.under{pointer-events:none}
.card .poster{position:absolute;inset:0}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 18px 26px;background:linear-gradient(to top,rgba(10,6,14,.97) 0,rgba(10,6,14,.88) 55%,rgba(10,6,14,0) 100%);display:flex;flex-direction:column;gap:8px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .star{color:var(--gold);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);white-space:nowrap}
.chip.prov{background:rgba(229,57,143,.16);border-color:rgba(229,57,143,.4);color:#ffc2df}
.desc{font-size:14px;color:#e6dcea;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.castline{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.castline b{color:#e6dcea;font-weight:600}
.meta .fsk{border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:0 5px;font-size:11.5px;font-weight:700;color:#e6dcea}
.chip.more-prov{background:none;border-style:dashed;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.provs{display:flex;flex-direction:column;gap:8px}
.provs .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.provs .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:64px}
.tagline{margin:0;font-style:italic;color:var(--muted);font-size:14px}
.credit{font-size:12px;color:var(--muted);margin:0}
.card .more{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(10,6,14,.55);backdrop-filter:blur(6px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.15);z-index:3}
.stamp{position:absolute;top:34px;font-family:var(--display);font-weight:900;font-size:42px;letter-spacing:.04em;padding:2px 14px;border:5px solid;border-radius:12px;opacity:0;z-index:2;text-transform:uppercase;pointer-events:none}
.stamp.like{left:28px;color:var(--like);border-color:var(--like);transform:rotate(-14deg)}
.stamp.nope{right:28px;color:var(--nope);border-color:var(--nope);transform:rotate(14deg)}
.partner-liked{position:absolute;top:14px;left:26px;z-index:3;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:rgba(37,201,125,.18);border:1px solid rgba(37,201,125,.5);color:#bff3d8;border-radius:99px;padding:4px 10px 4px 6px;backdrop-filter:blur(6px)}

.actions{display:flex;justify-content:center;align-items:center;gap:18px;padding-block:34px calc(var(--nav-h) + 14px)}
.act{border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);transition:transform .12s}
.act:active{transform:scale(.92)}
.act.big{width:66px;height:66px}
.act.small{width:46px;height:46px;color:var(--muted)}
.act.nope{color:var(--nope)} .act.like{color:var(--like)}
.act:disabled{opacity:.35}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px;border:1.5px dashed var(--line);border-radius:22px}
.empty h2{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:0;color:#fff}
.btn.ghost{background:none}
.btn.danger{color:var(--nope);border-color:rgba(255,61,94,.4)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- poster art ---------- */
.poster{container-type:size;background:linear-gradient(165deg,var(--c2) 0%,#07050b 100%);overflow:hidden;position:relative}
.poster .shape{position:absolute;pointer-events:none}
.poster.c0 .shape{width:95cqw;height:95cqw;border-radius:50%;right:-28cqw;top:-18cqw;background:radial-gradient(circle at 40% 40%,var(--c1),color-mix(in srgb,var(--c1) 30%,transparent) 70%);opacity:.9}
.poster.c1 .shape{width:160cqw;height:38cqh;left:-30cqw;top:18cqh;transform:rotate(-24deg);background:linear-gradient(90deg,transparent,var(--c1) 30%,color-mix(in srgb,var(--c1) 60%,#fff) 50%,var(--c1) 70%,transparent);opacity:.8}
.poster.c2 .shape{width:170cqw;height:170cqw;border-radius:50%;left:-35cqw;top:-55cqw;background:repeating-radial-gradient(circle,var(--c1) 0 3cqw,transparent 3cqw 8cqw);opacity:.45}
.poster::before,.poster::after{content:"";position:absolute;top:0;bottom:0;width:4.2cqw;min-width:6px;background:repeating-linear-gradient(to bottom,transparent 0 2.2cqw,rgba(255,255,255,.22) 2.2cqw 4.6cqw,transparent 4.6cqw 6.8cqw);z-index:1}
.poster::before{left:1.6cqw}
.poster::after{right:1.6cqw}
.poster .ptitle{position:absolute;left:9cqw;right:9cqw;top:10cqh;font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.9;font-size:var(--ts,15cqw);letter-spacing:.01em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45);z-index:1;overflow-wrap:anywhere;text-wrap:balance}
.poster .pyear{position:absolute;left:9cqw;top:4cqh;font-family:var(--display);font-weight:800;font-size:6cqw;letter-spacing:.18em;color:rgba(255,255,255,.75);z-index:1}
.poster .ptype{position:absolute;right:9cqw;top:4cqh;font-weight:700;font-size:4.2cqw;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);z-index:1}
.poster.mini .pyear,.poster.mini .ptype{display:none}
.poster.mini .ptitle{top:auto;bottom:8cqh;left:12cqw;right:12cqw;font-size:var(--tsm,20cqw)}
.poster.mini::before,.poster.mini::after{width:7cqw}

/* ---------- lists ---------- */
h1.page{font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;margin:6px 0 2px;line-height:1}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.sec-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;text-align:left;width:100%}
.item .poster{width:58px;height:84px;border-radius:10px;flex:none}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .t{font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item.seen{opacity:.6}
.toggle{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.toggle.on{color:var(--like);border-color:rgba(37,201,125,.5);background:rgba(37,201,125,.1)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:16px}
.panel p{margin:0;color:var(--muted);font-size:14px}
.code{font-family:var(--display);font-weight:900;font-size:46px;letter-spacing:.18em;line-height:1;user-select:all;-webkit-user-select:all}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:16px}
.input.code-in{text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.people{display:flex;gap:16px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.person img{width:34px;height:34px;border-radius:50%;flex:none}
.person .wait{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--muted);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.steps b{color:var(--fg)}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px}
.err{color:var(--nope);font-size:13.5px;font-weight:600}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(17,11,22,0))}
.nav-in{max-width:488px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:10px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"] svg{color:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--like);color:#06140c;font-size:11px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* ---------- sheets / overlays ---------- */
.backdrop{position:fixed;inset:0;background:rgba(5,2,8,.66);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-in{position:relative}
.sheet-x{position:absolute;top:0;right:0;width:36px;height:36px}
.sheet h2{padding-right:44px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
.detail-top{display:flex;gap:14px;align-items:flex-start}
.detail-top .poster{width:110px;height:160px;border-radius:12px;flex:none}
.detail-top .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links a{text-decoration:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.pick button[aria-pressed="true"]{background:rgba(229,57,143,.18);border-color:var(--accent);color:var(--fg)}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-row output{font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.years{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.years span{color:var(--muted)}
select.input{appearance:none}

.match{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,rgba(229,57,143,.55),rgba(17,11,22,.97) 65%)}
.match h2{font-family:var(--display);font-weight:900;font-size:72px;text-transform:uppercase;margin:0;line-height:.9;background:linear-gradient(135deg,#fff,#ffc2df);-webkit-background-clip:text;background-clip:text;color:transparent}
.match p{margin:0;color:#f0dff2;max-width:28ch}
.match .poster{width:170px;height:246px;border-radius:16px;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-8deg)}to{transform:none}}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.banner{margin:0 max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.banner button{color:var(--accent);font-weight:700;flex:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand" aria-label="Filmduo">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="5" width="15" height="21" rx="3" fill="#8d48d8" transform="rotate(-8 9 15)"/><rect x="12" y="4" width="15" height="21" rx="3" fill="#e5398f" transform="rotate(7 19 14)"/><path d="M19.4 17.6c-2.6-1.7-4-3-4-4.6 0-1.1.9-2 2-2 .8 0 1.5.4 2 1.1.5-.7 1.2-1.1 2-1.1 1.1 0 2 .9 2 2 0 1.6-1.4 2.9-4 4.6z" fill="#fff"/></svg>
      Filmduo
    </div>
    <div class="grow"></div>
    <div class="partner-chip" id="partnerChip" hidden></div>
    <button class="icon-btn" id="filterBtn" aria-label="Filter">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span class="dot" id="filterDot" hidden></span>
    </button>
  </header>

  <main>
    <section class="view" id="view-swipe">
      <div class="banner" id="banner" hidden></div>
      <div class="stage" id="stage"></div>
      <div class="actions">
        <button class="act small" id="undoBtn" aria-label="Rückgängig" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button class="act big nope" id="nopeBtn" aria-label="Nicht ansehen"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button class="act big like" id="likeBtn" aria-label="Will ich sehen"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5c-5.6-3.7-9-6.9-9-10.6C3 7.2 5.1 5 7.7 5c1.8 0 3.3.9 4.3 2.4C13 5.9 14.5 5 16.3 5 18.9 5 21 7.2 21 9.9c0 3.7-3.4 6.9-9 10.6z"/></svg></button>
        <button class="act small" id="infoBtn" aria-label="Details"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
      </div>
    </section>
    <section class="view scroll" id="view-matches" hidden></section>
    <section class="view scroll" id="view-duo" hidden></section>
  </main>

  <nav class="nav" aria-label="Bereiche">
    <div class="nav-in" role="tablist">
      <button class="tab" role="tab" data-tab="swipe" aria-selected="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="12" height="17" rx="2.5" transform="rotate(-6 10 11)"/><rect x="9" y="4" width="11" height="16" rx="2.5" fill="var(--surface)" transform="rotate(6 14 12)"/></svg>Swipen</button>
      <button class="tab" role="tab" data-tab="matches" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20c-5.4-3.6-8.5-6.6-8.5-10.1C3.5 7.4 5.4 5.5 7.9 5.5c1.7 0 3.1.9 4.1 2.2 1-1.3 2.4-2.2 4.1-2.2 2.5 0 4.4 1.9 4.4 4.4 0 3.5-3.1 6.5-8.5 10.1z"/></svg>Matches<span class="badge" id="matchBadge" hidden></span></button>
      <button class="tab" role="tab" data-tab="duo" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="9" r="3.2"/><circle cx="16" cy="9" r="3.2"/><path d="M2.5 19c.6-3 3-4.8 6-4.8s5.4 1.8 6 4.8M13 14.4c.9-.3 1.9-.4 3-.2 2.7.4 4.6 2.1 5.1 4.8"/></svg>Duo</button>
    </div>

</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="sheet-in" id="sheetIn"></div></div>
<div class="match" id="matchOverlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const CATALOG_RAW = /*CATALOG*/``;
const GENRES = ["Action","Abenteuer","Animation","Doku","Drama","Familie","Fantasy","Historie","Horror","Komödie","Krieg","Krimi","Musik","Mystery","Reality","Romantik","Sci-Fi","Thriller","Western"];
const PROV = {N:"Netflix",P:"Amazon Prime Video",D:"Disney Plus",A:"Apple TV+",H:"HBO Max"}; // Codes des alten Startkatalogs
// TMDB-Genrenamen (de/en, Filme und Serien) -> Genres der App
const GMAP = {"Liebesfilm":["Romantik"],"Romance":["Romantik"],"Science Fiction":["Sci-Fi"],"Science-Fiction":["Sci-Fi"],"Dokumentarfilm":["Doku"],"Documentary":["Doku"],"Kriegsfilm":["Krieg"],"War":["Krieg"],"War & Politics":["Krieg"],"Krieg & Politik":["Krieg"],"Action & Adventure":["Action","Abenteuer"],"Sci-Fi & Fantasy":["Sci-Fi","Fantasy"],"Kids":["Familie"],"Family":["Familie"],"Soap":["Drama"],"Komödie":["Komödie"],"Comedy":["Komödie"],"Crime":["Krimi"],"Adventure":["Abenteuer"],"History":["Historie"],"Music":["Musik"],"Musical":["Musik"],"TV-Film":[],"TV Movie":[],"News":[],"Talk":[]};
const normGenres = arr => { const out = []; for (const g of arr || []) for (const x of (GMAP[g] ?? (GENRES.includes(g) ? [g] : []))) if (!out.includes(x)) out.push(x); return out.length ? out.slice(0,3) : ["Drama"]; };
// Streaming-Namen kürzer anzeigen
const PNAME = {"Amazon Prime Video":"Prime Video","Amazon Prime Video with Ads":"Prime Video","Disney Plus":"Disney+","Netflix Standard with Ads":"Netflix","Netflix basic with Ads":"Netflix","Paramount Plus":"Paramount+","Paramount Plus Apple TV Channel":"Paramount+","WOW Presents Plus":"WOW Presents","Apple TV Plus":"Apple TV+","Apple TV":"Apple TV"};
const pn = p => PNAME[p] || p;
const uniq = a => [...new Set(a)];
const GCOL = {Action:["#ff5a36","#2b0d14"],Abenteuer:["#f2a33a","#152637"],Animation:["#36d8c6","#36196a"],Doku:["#9fd27a","#0f2a22"],Drama:["#e0a560","#26192f"],Familie:["#ffd166","#352a7a"],Fantasy:["#b48cff","#16123a"],Historie:["#cfa86c","#2b2017"],Horror:["#d1162a","#0c0507"],Komödie:["#ffcf3a","#b32656"],Krieg:["#9aab5f","#1a1d14"],Krimi:["#4f8cff","#0b1022"],Musik:["#ff4fd8","#1b0f3a"],Mystery:["#6f7dff","#0d0b1f"],Reality:["#ff9a5a","#3a1530"],Romantik:["#ff6f91","#3b0f2b"],"Sci-Fi":["#22e0ff","#0a0f2c"],Thriller:["#a7b0c4","#0e1016"],Western:["#e08a3c","#2a160a"]};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "titel";
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const lsGet = (k,d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

/* ---------- catalog ---------- */
// Einheitliches Format für alle Titel:
// {id,type:"f"|"s",title,orig,year,genres,rating,votes,desc,tagline,runtime,seasons,episodes,status,cast,crew,network,fsk,prov:{flat,rent,buy},trailer,tmdb,custom}
const emptyProv = () => ({flat:[],rent:[],buy:[]});
const BASE = [];
{ const seen = new Set();
  for (const line of CATALOG_RAW.trim().split("\n")) {
    if (!line) continue;
    const [type,title,year,genres,rating,prov,desc] = line.split("|");
    let id = slug(title) + "-" + year; if (seen.has(id)) id += "-" + type; seen.add(id);
    BASE.push({id,type,title,year:+year,genres:genres.split(","),rating:+rating,votes:0,desc,prov:{flat:prov&&PROV[prov]?[pn(PROV[prov])]:[],rent:[],buy:[]},cast:[],crew:[],tmdb:false,custom:false});
  } }

const strs = (a, n) => Array.isArray(a) ? a.filter(x => typeof x === "string" && x).map(x => x.slice(0,80)).slice(0,n) : [];
function fromTmdb(x){
  if (!x || typeof x.id !== "string" || !/^[mt]\d+$/.test(x.id) || !x.title) return null;
  const p = x.prov || {};
  return {
    id: x.id, type: x.t === "s" ? "s" : "f", title: String(x.title).slice(0,120), orig: String(x.orig || "").slice(0,120),
    year: +x.year || 0, genres: normGenres(strs(x.genres, 4)), rating: +x.rating || 0, votes: +x.votes || 0,
    desc: String(x.overview || "").slice(0,1200), tagline: String(x.tagline || "").slice(0,200),
    runtime: +x.runtime || 0, seasons: +x.seasons || 0, episodes: +x.episodes || 0, status: String(x.status || ""),
    cast: strs(x.cast, 6), crew: strs(x.crew, 2), network: strs(x.network, 2), fsk: String(x.fsk || "").slice(0,4),
    prov: {flat: uniq(strs(p.flat, 12).map(pn)), rent: uniq(strs(p.rent, 12).map(pn)), buy: uniq(strs(p.buy, 12).map(pn))},
    trailer: /^[\w-]{6,20}$/.test(x.trailer || "") ? x.trailer : "", tmdb: true, custom: false,
  };
}

// Aktiver Katalog: TMDB (aus der Datenbank), sonst der Startkatalog.
let CATALOG = BASE;
let CAT_META = null;            // {updated,count,...} wenn TMDB-Katalog aktiv
let INDEX = new Map();          // id -> item
let RANK = new Map();           // id -> 0..1 (0 = am beliebtesten)
let ALIAS = new Map();          // alte Startkatalog-ID -> TMDB-ID, damit alte Swipes weiter zählen
const canon = id => ALIAS.get(id) || id;
function reindex(){
  INDEX = new Map(); RANK = new Map();
  const n = Math.max(CATALOG.length, 1);
  CATALOG.forEach((it, k) => { INDEX.set(it.id, it); RANK.set(it.id, k / n); });
  for (const c of S.custom) INDEX.set(c.id, c);
  S.watched = new Set([...S.watchedRaw].map(canon));
}
function buildAlias(items){
  const key = new Map();
  for (const it of items) for (const t of [it.title, it.orig]) if (t) { const k = slug(t) + "-" + it.year; if (!key.has(k)) key.set(k, it.id); }
  const a = new Map();
  for (const b of BASE) {
    const s = slug(b.title);
    const hit = key.get(s + "-" + b.year) || key.get(s + "-" + (b.year + 1)) || key.get(s + "-" + (b.year - 1));
    if (hit) a.set(b.id, hit);
  }
  return a;
}
function useCatalog(items, meta){
  const seen = new Set(), list = [];
  for (const raw of items) { const it = fromTmdb(raw); if (it && !seen.has(it.id)) { seen.add(it.id); list.push(it); } }
  if (list.length < 50) return false;
  ALIAS = buildAlias(list);
  // Titel aus dem Startkatalog, die es bei TMDB nicht gibt, bleiben erhalten (mit ihren alten Swipes).
  const mapped = new Set(ALIAS.keys());
  CATALOG = list.concat(BASE.filter(b => !mapped.has(b.id)));
  CAT_META = meta || null;
  reindex();
  return true;
}

// Zwischenspeicher im Browser, damit der Katalog nicht bei jedem Öffnen neu geladen wird.
const IDB = {
  open(){ return new Promise((res, rej) => { try { const r = indexedDB.open("filmduo", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async get(k){ try { const d = await IDB.open(); return await new Promise(res => { const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch { return undefined; } },
  async set(k, v){ try { const d = await IDB.open(); await new Promise(res => { const t = d.transaction("kv","readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; }); } catch {} },
};

async function loadCatalog(db){
  let meta;
  try { const s = await db.doc("catalog/meta").get(); if (!s.exists) return false; meta = s.data(); }
  catch { return false; }
  const n = Math.min(+meta.chunks || 0, 200);
  if (!n || !meta.updated) return false;
  const cached = await IDB.get("catalog");
  if (cached && cached.updated === meta.updated && Array.isArray(cached.items)) return useCatalog(cached.items, meta);
  const ids = Array.from({length: n}, (_, i) => "c" + String(i).padStart(2, "0"));
  const parts = new Array(n);
  try {
    let next = 0; // höchstens 4 gleichzeitig, um das Abruflimit zu schonen
    const worker = async () => { while (next < n) { const i = next++; const s = await db.doc("catalog/" + ids[i]).get(); parts[i] = s.exists ? (s.data().items || []) : []; } };
    await Promise.all([worker(), worker(), worker(), worker()]);
  } catch { return cached ? useCatalog(cached.items, meta) : false; }
  const items = parts.flat();
  if (!useCatalog(items, meta)) return false;
  IDB.set("catalog", {updated: meta.updated, items});
  return true;
}

/* ---------- state ---------- */
const S = {
  mode: "loading",           // loading | local | db
  db: null, user: null, uid: null, isOwner: false,
  pair: null, members: [], partner: null, partnerName: "", partnerAvatar: "", meAvatar: "", meName: "",
  swipes: new Map(),         // key uid~id -> {u,i,l,t}
  watched: new Set(), watchedRaw: new Set(), custom: [],
  queue: [], undo: [], tab: "swipe",
  filters: null,
  subs: [], firstSwipeSnap: true, busy: false, profileLoaded: false,
};
const YEAR_MIN = 1920, YEAR_MAX = new Date().getFullYear() + 1;
const DEFAULT_FILTERS = () => ({type:"all",genres:[],min:0,prov:[],from:YEAR_MIN,to:YEAR_MAX,maxlen:0});
S.filters = Object.assign(DEFAULT_FILTERS(), lsGet("filmduo.filters2", {}));
reindex();
const allItems = () => CATALOG.concat(S.custom);
const byId = id => INDEX.get(canon(id));
function mine(){ const m = new Map(); for (const s of S.swipes.values()) if (s.u === (S.uid||"me")) m.set(canon(s.i), s.l); return m; }
function theirs(){ const m = new Map(); if (!S.partner) return m; for (const s of S.swipes.values()) if (s.u === S.partner) m.set(canon(s.i), s.l); return m; }
function matches(){ const a = mine(), b = theirs(), out = []; for (const [i,l] of a) if (l && b.get(i) === true) { const it = byId(i); if (it) out.push(it); } return out; }

function passes(it){
  const f = S.filters;
  if (f.type !== "all" && it.type !== f.type) return false;
  if (f.genres.length && !it.genres.some(g => f.genres.includes(g))) return false;
  if (f.min && (it.rating || 0) < f.min) return false;
  if (f.prov.length && !(it.prov?.flat || []).some(p => f.prov.includes(p))) return false;
  if (f.maxlen && it.runtime && it.runtime > f.maxlen) return false;
  if (it.year && (it.year < f.from || it.year > f.to)) return false;
  return true;
}
function filtersActive(){ const f = S.filters; return f.type!=="all"||f.genres.length||f.min||f.prov.length||f.maxlen||f.from!==YEAR_MIN||f.to!==YEAR_MAX; }

function rebuildQueue(){
  const me = mine(), them = theirs(), seed = S.uid || "local";
  const items = allItems().filter(it => !me.has(it.id) && passes(it));
  // Beliebte Titel kommen eher, gemischt mit Zufall. Was dein Duo mag, rückt nach vorn,
  // aber nicht ganz oben, damit es nicht auffällt.
  const key = it => (RANK.get(it.id) ?? 0.5) * .7 + (hash(seed + it.id) % 1000) / 1000 * .3 - (them.get(it.id) === true ? .2 : 0) - (it.custom ? 1 : 0);
  const k = new Map(items.map(it => [it.id, key(it)]));
  items.sort((a,b) => k.get(a.id) - k.get(b.id));
  S.queue = items.map(i => i.id);
}

/* ---------- poster art ---------- */
function posterHTML(it, mini){
  const [c1,c2] = GCOL[it.genres[0]] || ["#e5398f","#1b1323"];
  const h = hash(it.id), comp = h % 3;
  const len = it.title.length;
  const ts = len > 34 ? 9 : len > 24 ? 10.5 : len > 16 ? 12.5 : len > 9 ? 15 : 19;
  const tsm = len > 24 ? 12 : len > 14 ? 15 : 20;
  return `<div class="poster c${comp}${mini?" mini":""}" style="--c1:${c1};--c2:${c2};--ts:${ts}cqw;--tsm:${tsm}cqw" aria-hidden="true"><div class="shape"></div><div class="pyear">${it.year} · ${it.type==="s"?"Serie":"Film"}</div><div class="ptitle">${esc(it.title)}</div></div>`;
}
function fmtRuntime(m){ if (!m) return ""; const h = Math.floor(m / 60), r = m % 60; return h ? `${h} Std.${r ? ` ${r} Min.` : ""}` : `${r} Min.`; }
function lengthText(it){
  if (it.type === "s") {
    const parts = [];
    if (it.seasons) parts.push(`${it.seasons} ${it.seasons === 1 ? "Staffel" : "Staffeln"}`);
    if (it.runtime) parts.push(`~${it.runtime} Min./Folge`);
    return parts.join(" · ");
  }
  return fmtRuntime(it.runtime);
}
const fskHTML = it => /^\d{1,2}$/.test(it.fsk || "") ? `<span class="fsk" title="FSK ${esc(it.fsk)}">${esc(it.fsk)}+</span>` : "";
const metaHTML = it => `<span>${it.year || ""}</span><span>${it.type==="s"?"Serie":"Film"}</span>${lengthText(it)?`<span>${esc(lengthText(it))}</span>`:""}${it.rating?`<span class="star">★ ${it.rating.toFixed(1)}</span>`:""}${fskHTML(it)}`;
function chipsHTML(it, maxProv = 3){
  const flat = it.prov?.flat || [];
  const sel = S.filters.prov;
  // gefilterte Dienste zuerst zeigen
  const ordered = sel.length ? flat.filter(p => sel.includes(p)).concat(flat.filter(p => !sel.includes(p))) : flat;
  const shown = ordered.slice(0, maxProv), rest = ordered.length - shown.length;
  return `${shown.map(p=>`<span class="chip prov">${esc(p)}</span>`).join("")}${rest>0?`<span class="chip more-prov">+${rest}</span>`:""}${it.genres.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}`;
}
const castLine = it => it.cast?.length ? `<div class="castline">Mit <b>${esc(it.cast.slice(0,3).join(", "))}</b></div>` : "";

/* ---------- swipe deck ---------- */
function renderDeck(){
  const stage = $("#stage");
  stage.innerHTML = "";
  const them = theirs();
  const top3 = S.queue.slice(0,3);
  if (!top3.length){
    stage.innerHTML = `<div class="empty"><h2>${filtersActive()?"Keine Titel mehr für diese Filter":"Alles durchgeswiped"}</h2><p>${filtersActive()?"Lockere die Filter oder füge eigene Titel hinzu.":"Ihr habt den ganzen Katalog bewertet. Füge eigene Titel hinzu, um weiterzumachen."}</p><div class="row" style="justify-content:center">${filtersActive()?`<button class="btn" data-act="filters">Filter anpassen</button>`:""}<button class="btn primary" data-act="add">Titel hinzufügen</button></div></div>`;
    stage.querySelector('[data-act="filters"]')?.addEventListener("click", openFilters);
    stage.querySelector('[data-act="add"]').addEventListener("click", () => { setTab("duo"); setTimeout(()=>$("#addTitle")?.focus(),50); });
  }
  top3.slice().reverse().forEach((id, ri) => {
    const i = top3.length - 1 - ri, it = byId(id); if (!it) return;
    const el = document.createElement("article");
    el.className = "card" + (i ? " under" : "");
    el.style.transform = i ? `translateY(${i*12}px) scale(${1 - i*.045})` : "";
    el.style.zIndex = 10 - i;
    el.innerHTML = `${posterHTML(it)}
      ${i===0 && them.get(id)===true ? `<div class="partner-liked">♥ ${esc(S.partnerName || "Dein Duo")} will das sehen</div>` : ""}
      <button class="more" aria-label="Details zu ${esc(it.title)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 11v6M12 7.5v.5"/></svg></button>
      <div class="stamp like">Mag ich</div><div class="stamp nope">Nö</div>
      <div class="info"><div class="meta">${metaHTML(it)}</div><div class="chips">${chipsHTML(it)}</div><div class="desc">${esc(it.desc || "Keine Beschreibung.")}</div>${castLine(it)}</div>`;
    el.querySelector(".more").addEventListener("click", e => { e.stopPropagation(); openDetail(it); });
    if (!i) bindDrag(el, it);
    stage.appendChild(el);
  });
  $("#undoBtn").disabled = !S.undo.length;
  $("#likeBtn").disabled = $("#nopeBtn").disabled = $("#infoBtn").disabled = !top3.length;
}

function bindDrag(card, it){
  let sx=0, sy=0, dx=0, dy=0, t0=0, down=false;
  const like = card.querySelector(".stamp.like"), nope = card.querySelector(".stamp.nope");
  card.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || S.busy) return;
    down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0; t0 = performance.now();
    card.setPointerCapture(e.pointerId); card.style.transition = "none";
  });
  card.addEventListener("pointermove", e => {
    if (!down) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    card.style.transform = `translate(${dx}px,${dy*.4}px) rotate(${dx/16}deg)`;
    like.style.opacity = Math.max(0, Math.min(1, dx/90));
    nope.style.opacity = Math.max(0, Math.min(1, -dx/90));
  });
  const end = () => {
    if (!down) return; down = false;
    const dt = performance.now() - t0, v = Math.abs(dx) / Math.max(dt,1);
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6 && dt < 350) { card.style.transform = ""; openDetail(it); return; }
    if (Math.abs(dx) > 110 || (Math.abs(dx) > 45 && v > .55)) { fly(card, dx > 0, dy*.4); return; }
    card.style.transition = ""; card.style.transform = ""; like.style.opacity = nope.style.opacity = 0;
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

function fly(card, isLike, dy=0){
  if (S.busy) return; S.busy = true;
  const id = S.queue[0], it = byId(id);
  card.style.transition = "transform .32s ease-in, opacity .32s ease-in";
  card.querySelector(isLike ? ".stamp.like" : ".stamp.nope").style.opacity = 1;
  card.style.transform = `translate(${(isLike?1:-1)*window.innerWidth*1.1}px,${dy-30}px) rotate(${isLike?28:-28}deg)`;
  card.style.opacity = "0";
  setTimeout(() => { S.busy = false; commitSwipe(it, isLike); }, 260);
}
function swipeTop(isLike){ const card = $("#stage .card:not(.under)"); if (card) fly(card, isLike); }

async function commitSwipe(it, isLike){
  if (!it) return;
  const uid = S.uid || "me", key = uid + "~" + it.id;
  const rec = {u: uid, i: it.id, l: isLike, t: Date.now()};
  S.swipes.set(key, rec);
  S.queue = S.queue.filter(x => x !== it.id);
  S.undo.push(it.id); if (S.undo.length > 30) S.undo.shift();
  renderDeck(); renderBadge();
  if (isLike && theirs().get(it.id) === true) showMatch(it);
  if (S.mode === "db" && S.pair) {
    try { await S.db.doc(`pairs/${S.pair}/swipes/${key}`).set(rec); }
    catch (e) { toast(writeError(e)); }
  } else saveLocal();
}

async function undo(){
  const id = S.undo.pop(); if (!id) return;
  const key = (S.uid || "me") + "~" + id;
  S.swipes.delete(key);
  S.queue.unshift(id);
  renderDeck(); renderBadge();
  if (S.mode === "db" && S.pair) { try { await S.db.doc(`pairs/${S.pair}/swipes/${key}`).delete(); } catch (e) { toast(writeError(e)); } }
  else saveLocal();
}

function writeError(e){
  if (e && e.code === "quota_exceeded") return "Der Speicher ist voll. Entfernt alte Titel, um weiterzumachen.";
  if (e && e.code === "invalid_argument") return "Speichern nicht erlaubt. Bitte den Besitzer, dich als Bearbeiter einzuladen.";
  return "Konnte nicht speichern. Prüfe deine Verbindung.";
}

/* ---------- local mode ---------- */
function saveLocal(){
  if (S.mode === "db") return;
  lsSet("filmduo.local", {swipes:[...S.swipes.values()], watched:[...S.watchedRaw], custom:S.custom});
}
const normCustom = c => ({...c, prov: c.prov && typeof c.prov === "object" ? c.prov : emptyProv(), cast: [], crew: [], custom: true});
function loadLocal(){
  const d = lsGet("filmduo.local", null); if (!d) return;
  S.swipes = new Map((d.swipes||[]).map(s => [s.u+"~"+s.i, s]));
  S.watchedRaw = new Set(d.watched||[]); S.custom = (d.custom||[]).map(normCustom);
  reindex();
}

/* ---------- matches view ---------- */
function renderBadge(){
  const n = matches().filter(m => !S.watched.has(m.id)).length;
  const b = $("#matchBadge"); b.hidden = !n; b.textContent = n;
}
function renderMatches(){
  const v = $("#view-matches");
  const all = matches().sort((a,b) => a.title.localeCompare(b.title, "de"));
  const open = all.filter(m => !S.watched.has(m.id)), seen = all.filter(m => S.watched.has(m.id));
  let h = `<h1 class="page">Matches</h1><p class="sub">${S.partner ? `Titel, die ${esc(S.partnerName || "dein Duo")} und du sehen wollt.` : "Sobald dein Partner im Duo ist und swipet, landen gemeinsame Likes hier."}</p>`;
  if (open.length > 1) h += `<button class="btn primary" id="randomBtn" style="width:100%">Was schauen wir heute? Zufällig wählen</button>`;
  if (!all.length) {
    h += `<div class="panel" style="margin-top:8px"><h3>Noch keine Matches</h3><p>${S.mode==="db" && !S.pair ? "Bilde zuerst im Tab Duo ein Duo mit deinem Partner." : "Swipet weiter. Wenn ihr beide denselben Titel nach rechts wischt, erscheint er hier."}</p></div>`;
  }
  if (open.length) h += `<div class="sec-label">Noch nicht gesehen · ${open.length}</div><div class="list">${open.map(itemRow).join("")}</div>`;
  if (seen.length) h += `<div class="sec-label">Schon gesehen · ${seen.length}</div><div class="list">${seen.map(itemRow).join("")}</div>`;
  v.innerHTML = h;
  v.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", e => { if (e.target.closest("[data-watch]")) return; openDetail(byId(b.dataset.open)); }));
  v.querySelectorAll("[data-watch]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); toggleWatched(b.dataset.watch); }));
  $("#randomBtn")?.addEventListener("click", () => { const p = open[Math.floor(Math.random()*open.length)]; openDetail(p, "Heute Abend: "); });
}
const itemRow = it => `<div class="item${S.watched.has(it.id)?" seen":""}" data-open="${esc(it.id)}" role="button" tabindex="0">${posterHTML(it,true)}<div class="txt"><div class="t">${esc(it.title)}</div><div class="m">${it.year} · ${it.type==="s"?"Serie":"Film"}${lengthText(it)?` · ${esc(lengthText(it))}`:""}${it.rating?` · ★ ${it.rating.toFixed(1)}`:""}</div><div class="m">${(it.prov?.flat||[]).length?esc(it.prov.flat.slice(0,3).join(", ")):esc(it.genres.join(", "))}</div></div><button class="toggle${S.watched.has(it.id)?" on":""}" data-watch="${esc(it.id)}" aria-label="${S.watched.has(it.id)?"Als ungesehen markieren":"Als gesehen markieren"}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button></div>`;

async function toggleWatched(id){
  const on = !S.watched.has(id);
  // Beim Entfernen auch Einträge unter alten Startkatalog-IDs löschen.
  const rawIds = on ? [id] : [...S.watchedRaw].filter(r => canon(r) === id);
  for (const r of rawIds) on ? S.watchedRaw.add(r) : S.watchedRaw.delete(r);
  S.watched = new Set([...S.watchedRaw].map(canon));
  renderMatches(); renderBadge();
  if (S.mode === "db" && S.pair) {
    try {
      for (const r of rawIds) { const ref = S.db.doc(`pairs/${S.pair}/watched/${r}`); on ? await ref.set({t: Date.now(), by: S.uid}) : await ref.delete(); }
    } catch (e) { toast(writeError(e)); }
  } else saveLocal();
}

  const status = mine().get(it.id), them = theirs().get(it.id);
  const num = it.tmdb ? it.id.slice(1) : "";
  const kind = it.type === "s" ? "tv" : "movie";
  const whereUrl = it.tmdb ? `https://www.themoviedb.org/${kind}/${num}/watch?locale=DE` : `https://www.justwatch.com/de/Suche?q=${q}`;
  const trailerUrl = it.trailer ? `https://www.youtube.com/watch?v=${encodeURIComponent(it.trailer)}` : `https://www.youtube.com/results?search_query=${yt}`;
  const p = it.prov || emptyProv();
  const grp = (lbl, arr) => arr.length ? `<div class="grp"><span class="lbl">${lbl}</span>${arr.map(x=>`<span class="chip${lbl==="Abo"?" prov":""}">${esc(x)}</span>`).join("")}</div>` : "";
  const provBlock = it.tmdb
    ? (p.flat.length || p.rent.length || p.buy.length
        ? `<div class="provs">${grp("Abo", p.flat)}${grp("Leihen", p.rent)}${grp("Kaufen", p.buy)}</div><p class="credit">Streaming-Angebote in Deutschland laut JustWatch, Stand ${CAT_META?.updated ? new Date(CAT_META.updated).toLocaleDateString("de-DE") : "unbekannt"}.</p>`
        : `<p class="note">Läuft gerade bei keinem Streamingdienst in Deutschland.</p>`)
    : (p.flat.length ? `<p class="note">Eigenproduktion von ${esc(pn(p.flat[0]))}. Ob ein Titel gerade bei deinem Dienst läuft, zeigt dir JustWatch.</p>` : `<p class="note">Wo der Titel gerade läuft, ändert sich oft. JustWatch zeigt dir die aktuellen Anbieter in Deutschland.</p>`);
  const facts = [];
  if (lengthText(it)) facts.push(["Länge", lengthText(it) + (it.type === "s" && it.episodes ? ` (${it.episodes} Folgen)` : "")]);
  if (it.crew?.length) facts.push([it.type === "s" ? "Idee" : "Regie", it.crew.join(", ")]);
  if (it.cast?.length) facts.push(["Besetzung", it.cast.join(", ")]);
  if (it.network?.length) facts.push(["Sender", it.network.join(", ")]);
  if (it.type === "s" && it.status) facts.push(["Status", {"Returning Series":"läuft noch","Ended":"abgeschlossen","Canceled":"abgesetzt","In Production":"in Produktion"}[it.status] || it.status]);
  if (it.orig && it.orig !== it.title) facts.push(["Original", it.orig]);

    ${provBlock}
    ${it.rating ? `<p class="credit">★ ${it.tmdb ? `TMDB-Bewertung aus ${it.votes.toLocaleString("de-DE")} Stimmen` : "ungefährer IMDb-Wert"}.</p>` : ""}

async function addCustom(){
  const title = $("#addTitle").value.trim(), year = Math.round(+$("#addYear").value), err = $("#addErr");
  err.hidden = true;
  if (!title) { err.textContent = "Gib einen Titel ein."; err.hidden = false; return; }
  if (!(year >= 1900 && year <= 2030)) { err.textContent = "Das Jahr muss zwischen 1900 und 2030 liegen."; err.hidden = false; return; }
  const type = $("#addType [aria-pressed=true]").dataset.v;
  const id = slug(title) + "-" + year + "-eigen";
  if (byId(id)) { err.textContent = "Diesen Titel gibt es schon."; err.hidden = false; return; }
  const it = {id, type, title, year, genres:[$("#addGenre").value], rating:0, prov:emptyProv(), cast:[], crew:[], desc:$("#addDesc").value.trim(), custom:true};
  S.custom.push(it); INDEX.set(id, it); S.queue.unshift(id); renderDeck();
  if (S.mode === "db" && S.pair) {
    try { await S.db.doc(`pairs/${S.pair}/custom/${id}`).set({title, year, type, genres: it.genres, desc: it.desc, by: S.uid, t: Date.now()}); }
    catch (e) { toast(writeError(e)); }
  } else saveLocal();
  toast(`„${title}“ liegt oben auf deinem Stapel`);
  renderDuo();
}

/* ---------- pairing (db) ---------- */
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => CODE_CHARS[b % CODE_CHARS.length]).join("");
const profileRef = () => S.db.doc(`data/users/${S.uid}/profile`);

async function createPair(){
  const btn = $("#createBtn"); btn.disabled = true;
  try {
    let code;
    for (let k = 0; k < 5; k++) { code = newCode(); const s = await S.db.doc("pairs/"+code).get(); if (!s.exists) break; }
    await S.db.doc("pairs/"+code).set({members:[S.uid], created: Date.now()});
    await profileRef().set({pair: code});
    await enterPair(code);
    toast("Duo erstellt – schick deinem Partner den Code");
  } catch (e) { btn.disabled = false; toast(writeError(e)); }
}
async function joinPair(){
  const code = ($("#joinCode").value || "").trim().toUpperCase(), err = $("#joinErr");
  err.hidden = true;
  if (!/^[A-Z0-9]{6}$/.test(code)) { err.textContent = "Der Code hat 6 Zeichen."; err.hidden = false; return; }
  $("#joinBtn").disabled = true;
  try {
    const ref = S.db.doc("pairs/"+code), s = await ref.get();
    if (!s.exists) { err.textContent = "Diesen Code gibt es nicht. Prüfe ihn noch einmal."; err.hidden = false; $("#joinBtn").disabled = false; return; }
    const members = (s.data().members || []).slice();
    if (!members.includes(S.uid)) {
      if (members.length >= 2) { err.textContent = "Dieses Duo ist schon vollständig."; err.hidden = false; $("#joinBtn").disabled = false; return; }
      members.push(S.uid); await ref.update({members});
    }
    await profileRef().set({pair: code});
    await enterPair(code);
    toast("Ihr seid jetzt ein Duo");
  } catch (e) { $("#joinBtn").disabled = false; err.textContent = writeError(e); err.hidden = false; }
}
async function leavePair(){
  const code = S.pair;
  try {
    const ref = S.db.doc("pairs/"+code), s = await ref.get();
    if (s.exists) await ref.update({members: (s.data().members||[]).filter(m => m !== S.uid)});
    await profileRef().set({pair: null});
  } catch (e) { toast(writeError(e)); return; }
  exitPair(); toast("Duo verlassen");
}
function exitPair(){
  S.subs.forEach(u => u()); S.subs = [];
  S.pair = null; S.members = []; S.partner = null; S.partnerName = ""; S.swipes = new Map(); S.watchedRaw = new Set(); S.custom = []; S.undo = [];
  reindex(); rebuildQueue(); renderAll();
}

async function enterPair(code){
  S.subs.forEach(u => u()); S.subs = [];
  // Swipes made before the duo existed are carried into it.
  const carry = [...S.swipes.values()].filter(s => s.u === S.uid || s.u === "me").map(s => ({...s, u: S.uid, t: Date.now()}));
  S.pair = code; S.swipes = new Map(carry.map(s => [s.u+"~"+s.i, s])); S.watchedRaw = new Set(); S.custom = []; S.undo = []; S.firstSwipeSnap = true;
  reindex(); rebuildQueue(); renderAll();
  const base = S.db.doc("pairs/"+code);
  (async () => { for (const s of carry) { try { await base.collection("swipes").doc(s.u+"~"+s.i).set(s); } catch { break; } } })();
  const onErr = e => { if (e && e.code !== "revoked") toast("Verbindung unterbrochen. Lade die Seite neu."); };
  S.subs.push(base.onSnapshot(async snap => {
    S.members = snap.exists ? (snap.data().members || []) : [];
    const p = S.members.find(m => m !== S.uid) || null;
    const changed = p !== S.partner; S.partner = p;
    await resolveNames();
    if (changed) { rebuildQueue(); renderDeck(); }
    renderHeader(); renderBadge(); if (S.tab === "duo") renderDuo(); if (S.tab === "matches") renderMatches();
  }, onErr));
  S.subs.push(base.collection("swipes").onSnapshot(snap => {
    const fresh = new Map();
    for (const d of snap.docs) { const x = d.data(); if (x && x.i) fresh.set(d.id, x); }
    // keep my optimistic writes that haven't landed yet
    for (const [k,v] of S.swipes) if (v.u === S.uid && !fresh.has(k) && Date.now() - v.t < 60000) fresh.set(k, v);
    const before = matches().map(m => m.id);
    S.swipes = fresh;
    if (S.firstSwipeSnap) { S.firstSwipeSnap = false; rebuildQueue(); renderDeck(); }
    else {
      const mineNow = mine(); S.queue = S.queue.filter(id => !mineNow.has(id));
      const newM = matches().filter(m => !before.includes(m.id));
      // a match created by the partner's swipe (mine happens in commitSwipe)
      for (const ch of snap.docChanges()) { const x = ch.doc.data(); if (ch.type === "added" && x && x.u === S.partner && x.l && newM.some(m => m.id === x.i)) { toast(`Neues Match: ${byId(x.i)?.title || "ein Titel"}`); } }
    }
    renderBadge(); if (S.tab === "matches") renderMatches(); if (S.tab === "duo") renderDuo();
  }, onErr));
  S.subs.push(base.collection("watched").onSnapshot(snap => {
    S.watchedRaw = new Set(snap.docs.map(d => d.id));
    S.watched = new Set([...S.watchedRaw].map(canon));
    renderBadge(); if (S.tab === "matches") renderMatches();
  }, onErr));
  S.subs.push(base.collection("custom").onSnapshot(snap => {
    const known = new Set(S.custom.map(c => c.id));
    S.custom = snap.docs.map(d => { const x = d.data() || {}; return {id: d.id, type: x.type === "s" ? "s" : "f", title: String(x.title || "Ohne Titel").slice(0,80), year: +x.year || 2026, genres: Array.isArray(x.genres) && x.genres.length ? x.genres.map(String).slice(0,3) : ["Drama"], rating: 0, prov: emptyProv(), cast: [], crew: [], desc: String(x.desc || "").slice(0,200), custom: true}; });
    reindex();
    const me = mine();
    for (const c of S.custom) if (!known.has(c.id) && !me.has(c.id) && !S.queue.includes(c.id) && passes(c)) S.queue.splice(Math.min(2, S.queue.length), 0, c.id);
    renderDeck();
  }, onErr));
}

async function resolveNames(){
  if (!S.user) return;
  const ids = [S.uid, S.partner].filter(Boolean);
  const ps = await S.user.profiles(ids);
  S.meName = ps[S.uid]?.name || ""; S.meAvatar = ps[S.uid]?.avatarUrl || "";
  if (S.partner) { S.partnerName = ps[S.partner]?.name || ""; S.partnerAvatar = ps[S.partner]?.avatarUrl || ""; }
}

/* ---------- chrome ---------- */
function renderHeader(){
  const c = $("#partnerChip");
  if (S.partner) { c.hidden = false; c.innerHTML = `<img src="${esc(S.partnerAvatar)}" alt=""><span>mit ${esc(S.partnerName || "deinem Duo")}</span>`; }
  else c.hidden = true;
  $("#filterDot").hidden = !filtersActive();
  const b = $("#banner");
  if (S.mode === "db" && !S.pair) { b.hidden = false; b.innerHTML = `<span>Bilde ein Duo, damit eure Likes zu Matches werden.</span><button id="bannerGo">Duo bilden</button>`; $("#bannerGo").onclick = () => setTab("duo"); }
  else if (S.mode === "db" && S.pair && !S.partner) { b.hidden = false; b.innerHTML = `<span>Code <b style="color:var(--fg);letter-spacing:.1em">${esc(S.pair)}</b> an deinen Partner schicken</span><button id="bannerGo">Details</button>`; $("#bannerGo").onclick = () => setTab("duo"); }
  else if (S.mode === "local") { b.hidden = false; b.innerHTML = `<span>Nur auf diesem Gerät gespeichert.</span><button id="bannerGo">Warum?</button>`; $("#bannerGo").onclick = () => setTab("duo"); }
  else b.hidden = true;
}
function setTab(t){
  S.tab = t;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ["swipe","matches","duo"].forEach(x => $("#view-"+x).hidden = x !== t);
  $("#filterBtn").style.visibility = t === "swipe" ? "visible" : "hidden";
  if (t === "matches") renderMatches();
  if (t === "duo") renderDuo();
}
function renderAll(){ renderHeader(); renderDeck(); renderBadge(); if (S.tab === "matches") renderMatches(); if (S.tab === "duo") renderDuo(); }
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- wiring ---------- */
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("#likeBtn").onclick = () => swipeTop(true);
$("#nopeBtn").onclick = () => swipeTop(false);
$("#undoBtn").onclick = undo;
$("#infoBtn").onclick = () => openDetail(byId(S.queue[0]));
$("#filterBtn").onclick = openFilters;
$("#backdrop").onclick = closeSheet;
document.addEventListener("keydown", e => {
  if (!$("#sheet").hidden && e.key === "Escape") { closeSheet(); return; }
  if (!$("#matchOverlay").hidden && e.key === "Escape") { $("#matchOverlay").hidden = true; return; }
  if (S.tab !== "swipe" || !$("#sheet").hidden || e.target.closest("input,select,textarea")) return;
  if (e.key === "ArrowRight") swipeTop(true);
  else if (e.key === "ArrowLeft") swipeTop(false);
  else if (e.key === "ArrowUp") openDetail(byId(S.queue[0]));
});
$("#view-matches").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-open]")) openDetail(byId(e.target.dataset.open)); });

/* ---------- boot ---------- */
rebuildQueue(); renderAll();

(async () => {
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]); } catch {}
  S.user = user;
  const uid = user ? await user.id() : null;
  if (!db || !uid) { S.mode = "local"; loadLocal(); rebuildQueue(); renderAll(); return; }
  S.db = db; S.uid = uid; S.mode = "db";
  S.isOwner = await user.isOwner();
  // TMDB-Katalog laden (läuft parallel zum Duo, ersetzt danach den Startkatalog)
  loadCatalog(db).then(ok => {
    if (!ok) return;
    rebuildQueue(); renderAll();
    toast(`${CATALOG.filter(x => x.tmdb).length.toLocaleString("de-DE")} Titel von TMDB geladen`);
  }).catch(() => {});
  try {
    const p = await profileRef().get();
    const code = p.exists ? p.data().pair : null;
    if (code) {
      const pairSnap = await db.doc("pairs/"+code).get();
      if (pairSnap.exists) { await enterPair(code); return; }
    }
  } catch {}
  await resolveNames();
  rebuildQueue(); renderAll();
})();
</script>
